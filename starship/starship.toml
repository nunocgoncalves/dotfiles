add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_latte"
# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 1000

[directory.substitutions]
"~/Developer/iterabase-aisquare" = "ib-ai2"
"~/Developer/iterabase" = "ib"
"~/Developer/personal" = "dev"
"~/Developer/worktrees" = "wt"
"~/Documents/2nd-brain" = "brain"

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
style = 'bold blue'
symbol = " "

[golang]
format = '[ ](bold cyan)'

[kubernetes]
symbol = '☸ '
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
disabled = true

# Not needed in the prompt, and its default ☁️ symbol (U+2601 U+FE0F) is 1 column
# to zsh but 2 in ghostty, which shifted the cursor a row down on wrapped lines.
[gcloud]
disabled = true

