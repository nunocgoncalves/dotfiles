# ---------------------------------------------------------------------------
# LOCAL PATCH of catppuccin/k9s dist/catppuccin-latte.yaml
#
# The upstream Latte skin maps Catppuccin's accent colours 1:1, but most of
# them are too pale to read on Latte's near-white background (#eff1f5). Only
# three Latte colours clear WCAG AA (4.5:1) there: mauve #8839ef (4.79),
# red #d20f39 (4.80) and text #4c4f69 (7.06).
#
# This copy therefore uses mauve/red/text for the text-bearing keys (table
# header, frame title, info panel, help/menu keys, status labels, log
# indicator) and gives the dialog a light background instead of mid-grey
# #7c7f93, which could not carry readable text in any Latte colour.
#
# Deliberately left low-contrast (they are subtle chrome, not text): cursor
# and border colours, table markColor, xray graphics, chart backgrounds and
# the green add/toggle states, which have no darker Latte equivalent.
#
# Diff against upstream with:
#   curl -sL https://raw.githubusercontent.com/catppuccin/k9s/main/dist/catppuccin-latte.yaml | diff - k9s/skins/catppuccin-latte.yaml
# ---------------------------------------------------------------------------
k9s:
  body:
    fgColor: '#4c4f69'
    bgColor: '#eff1f5'
    logoColor: '#8839ef'
  prompt:
    fgColor: '#4c4f69'
    bgColor: '#e6e9ef'
    suggestColor: '#1e66f5'
  help:
    fgColor: '#4c4f69'
    bgColor: '#eff1f5'
    sectionColor: '#8839ef'
    keyColor: '#1e66f5'
    numKeyColor: '#d20f39'
  frame:
    title:
      fgColor: '#8839ef'
      bgColor: '#eff1f5'
      highlightColor: '#8839ef'
      counterColor: '#d20f39'
      filterColor: '#8839ef'
    border:
      fgColor: '#8839ef'
      focusColor: '#7287fd'
    menu:
      fgColor: '#4c4f69'
      keyColor: '#1e66f5'
      numKeyColor: '#d20f39'
    crumbs:
      fgColor: '#eff1f5'
      bgColor: '#d20f39'
      activeColor: '#dce0e8'
    status:
      newColor: '#1e66f5'
      modifyColor: '#8839ef'
      addColor: '#40a02b'
      pendingColor: '#d20f39'
      errorColor: '#d20f39'
      highlightColor: '#8839ef'
      killColor: '#8839ef'
      completedColor: '#6c6f85'
  info:
    fgColor: '#d20f39'
    sectionColor: '#4c4f69'
  views:
    table:
      fgColor: '#4c4f69'
      bgColor: '#eff1f5'
      cursorFgColor: '#ccd0da'
      cursorBgColor: '#bcc0cc'
      markColor: '#dc8a78'
      header:
        fgColor: '#8839ef'
        bgColor: '#eff1f5'
        sorterColor: '#d20f39'
    xray:
      fgColor: '#4c4f69'
      bgColor: '#eff1f5'
      cursorColor: '#bcc0cc'
      cursorTextColor: '#eff1f5'
      graphicColor: '#ea76cb'
    charts:
      bgColor: '#eff1f5'
      chartBgColor: '#eff1f5'
      dialBgColor: '#eff1f5'
      defaultDialColors:
        - '#40a02b'
        - '#d20f39'
      defaultChartColors:
        - '#40a02b'
        - '#d20f39'
      resourceColors:
        cpu:
          - '#8839ef'
          - '#1e66f5'
        mem:
          - '#df8e1d'
          - '#fe640b'
    yaml:
      keyColor: '#1e66f5'
      valueColor: '#4c4f69'
      colonColor: '#6c6f85'
    logs:
      fgColor: '#4c4f69'
      bgColor: '#eff1f5'
      indicator:
        fgColor: '#8839ef'
        bgColor: '#eff1f5'
        toggleOnColor: '#40a02b'
        toggleOffColor: '#6c6f85'
  dialog:
    fgColor: '#4c4f69'
    bgColor: '#e6e9ef'
    buttonFgColor: '#eff1f5'
    buttonBgColor: '#8839ef'
    buttonFocusFgColor: '#eff1f5'
    buttonFocusBgColor: '#d20f39'
    labelFgColor: '#6c6f85'
    fieldFgColor: '#4c4f69'
